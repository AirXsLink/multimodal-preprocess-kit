name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is EOL (2025-10) and its setup-python download is
        # unreliable on hosted runners; 3.10 is the oldest supported version.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Byte-compile
        run: python -m py_compile mm_preprocess_kit/*.py examples/*.py
      - name: Test
        run: pytest -q
