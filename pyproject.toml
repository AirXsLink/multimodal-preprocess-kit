[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-preprocess-kit"
version = "0.1.1"
description = "A framework-agnostic policy kit for chatbot multimodal preprocessing: caption retry, pending-message deferral, and safe fallback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "multimodal-preprocess-kit contributors" }]
keywords = ["chatbot", "multimodal", "preprocessing", "policy", "fallback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AirXsLink/multimodal-preprocess-kit"
Repository = "https://github.com/AirXsLink/multimodal-preprocess-kit"
Issues = "https://github.com/AirXsLink/multimodal-preprocess-kit/issues"
Changelog = "https://github.com/AirXsLink/multimodal-preprocess-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mm_preprocess_kit*"]

[tool.setuptools.package-data]
mm_preprocess_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
